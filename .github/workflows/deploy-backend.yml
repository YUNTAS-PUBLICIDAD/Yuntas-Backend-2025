name: Deploy Backend to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Excluimos carpetas que no deben sobreescribirse o que son pesadas
          exclude: |
            **/.git*
            **/node_modules/**
            **/vendor/**
            **/storage/**
            .env
          server-dir: public_html/back
          # Nota: Ajusta 'server-dir' segun la carpeta de tu subdominio de API
